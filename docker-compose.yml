services:
  postgres:
    image: postgres:16
    container_name: studenthelp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studenthelp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studenthelp}
      POSTGRES_DB: ${POSTGRES_DB:-studenthelp}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studenthelp} -d ${POSTGRES_DB:-studenthelp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studenthelp-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-studenthelp}:${POSTGRES_PASSWORD:-studenthelp}@postgres:5432/${POSTGRES_DB:-studenthelp}
      AUTO_CREATE_TABLES: "false"
    ports:
      - "8080:8000"
    volumes:
      - studenthelp_local_uploads:/app/local_uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    container_name: studenthelp-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  studenthelp_local_uploads: